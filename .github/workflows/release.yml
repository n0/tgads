name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Check release version
        run: |
          python - <<'PYTHON'
          import json, os, tomllib
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          with open('pyproject.toml', 'rb') as f:
              assert tomllib.load(f)['project']['version'] == version
          for path in ['packages/tgads/package.json']:
              with open(path) as f:
                  assert json.load(f)['version'] == version
          with open('docs/swagger.json') as f:
              assert json.load(f)['info']['version'] == version
          PYTHON
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm docs:check
      - run: python tgads.py --help
      - run: python docs/build_spec.py && git diff --exit-code -- docs/swagger.json
      - run: python -m pip install build twine
      - run: python -m build && python -m twine check dist/*
      - run: mkdir -p release && pnpm --filter tgads pack --pack-destination "$PWD/release"
      - run: python -m pip install dist/*.whl && tgads --help
      - name: Verify Node package import
        run: |
          mkdir -p "$RUNNER_TEMP/tgads-smoke"
          cd "$RUNNER_TEMP/tgads-smoke"
          npm init -y
          npm install "$GITHUB_WORKSPACE"/release/*.tgz
          node --input-type=module -e 'import { TgAdsClient } from "tgads"; console.log(typeof TgAdsClient)'
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble release assets
        run: |
          cp dist/*.whl dist/*.tar.gz release/
          cd release
          sha256sum *.whl *.tar.gz *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "tgads $RELEASE_TAG" --notes "Python CLI and Node client distributions. See CHANGELOG.md for release notes. Registry publication is separate."
