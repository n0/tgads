[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tgads"
version = "0.1.0"
description = "CLI for agents to manage Telegram Ads accounts and inspect campaign results (unofficial)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "tgads contributors" }]
keywords = ["telegram", "ads", "cli", "automation", "agents", "openapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []  # stdlib only

[project.scripts]
tgads = "tgads:main"

[project.urls]
Homepage = "https://github.com/n0/tgads"
Repository = "https://github.com/n0/tgads"
Issues = "https://github.com/n0/tgads/issues"

[tool.setuptools]
py-modules = ["tgads"]
